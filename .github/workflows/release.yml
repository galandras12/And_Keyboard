# Builds the debug APK for a version tag (v0.2, v0.3, ...) and publishes it as a GitHub *pre-release*.
# The release notes come from CHANGELOG.md: latest version first, then the whole changelog, then the source application.
name: Pre-release debug APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.0.13004108" "platform-tools"
          echo "sdk.dir=$SDK" > local.properties

      - name: Check that the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          echo "tag $TAG, versionName $VERSION"
          test "$TAG" = "$VERSION"

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Write the release notes
        run: python3 tools/release/release_notes.py "${GITHUB_REF_NAME#v}" > release_notes.md

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls app/build/outputs/apk/debug/AndKeyboard_*-debug.apk)"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --prerelease \
            --title "And Keyboard ${GITHUB_REF_NAME#v} (pre-release)" \
            --notes-file release_notes.md
